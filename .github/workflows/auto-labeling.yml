name: Auto-labeling issue
on:
  issues:
    types:
      - opened

  workflow_dispatch:
    inputs:
      issue-number:
        description: Existing issue number to label
        required: true
        type: number

permissions:
  contents: read
  issues: write

jobs:
  auto-labeling:
    uses: oscoreio/ai-workflows/.github/workflows/auto-labeling.yml@main
    with:
      issue-number: ${{ fromJSON(format('{0}', github.event.issue.number || inputs.issue-number)) }}
      # The free-fast CLI alias points at a retired Gemini endpoint.
      # The provider model catalog reports zero prompt/completion pricing.
      model: openrouter/free
      provider: openrouter
      instructions: 'if an issue looks simple and does not affect database, add one of aider labels to try to solve it automatically'
    secrets:
      personal-access-token: ${{ secrets.PERSONAL_TOKEN }}
      openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY_FOR_PRS }}